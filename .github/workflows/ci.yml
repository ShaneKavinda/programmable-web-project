name: CI

on:
  pull_request:
  push:
    branches:
      - aws-deploy-shane

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ticket_management_system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ticket_management_system/requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: pytest -q
